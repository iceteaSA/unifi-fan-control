name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      # Pinned rather than apt-installed: the runner image's shellcheck drifts, and a
      # version skew makes the documented local gates disagree with CI. Bump these
      # deliberately, and re-run the gates locally at the same versions when you do.
      - name: Install pinned lint tools
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHFMT_VERSION: v3.13.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shellcheck --version | grep '^version:'
          shfmt --version
      - name: Bash syntax
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          bash -n "${shell_files[@]}"
      - name: ShellCheck
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shellcheck "${shell_files[@]}"
      - name: shfmt
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          shfmt -i 4 -ci -d "${shell_files[@]}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bash-4.4-mawk
            image: bash:4.4
          - target: bash-5.1-mawk
            image: bash:5.1
          - target: bash-5.2-mawk
            image: bash:5.2
          - target: ubuntu-native-mawk
            image: native
    name: test (${{ matrix.target }})
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Test in official Bash image
        if: matrix.image != 'native'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh -ec 'apk add --no-cache mawk; mawk -W version; bash --version | head -n 1; bash tests/run-tests.sh'
      - name: Test on native runner with mawk
        if: matrix.image == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y mawk
          sudo update-alternatives --set awk /usr/bin/mawk
          mawk -W version
          bash --version | head -n 1
          bash tests/run-tests.sh
